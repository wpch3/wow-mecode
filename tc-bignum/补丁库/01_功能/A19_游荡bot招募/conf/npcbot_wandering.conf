[worldserver]

###############################################################################
# step33  游荡 NPCBot 招募开关
#
# 放置位置：
#     D:\TC-Build\bin\RelWithDebInfo\worldserver.conf.d\npcbot_wandering.conf
#
# 注意事项（踩过的坑）：
#     1. 必须有 [worldserver] 段头，否则整个文件不加载
#     2. 注释必须独立成行，不能写在配置行的行尾
#     3. 改完要重启 worldserver，不能热重载
###############################################################################

#
#    NpcBot.WanderingBot.AllowHire
#        允许玩家和野外游荡的 NPCBot 对话并招募它们。
#
#        Default: 0
#
#        0 - 关闭。完全维持 NPCBot 上游原版行为：
#            普通玩家右键游荡bot会直接关闭对话框，只有GM能对话。
#
#        1 - 开启。普通玩家可以：
#            - 和游荡bot打开对话框
#            - 在菜单里看到招募选项（按等级/职业收费）
#
#    【开启前必读 —— 三个固有副作用】
#
#    招募来的游荡bot仍然带着 wanderer 内部标记，源码里有30多处会
#    因为这个标记走不同分支。已知的行为差异：
#
#        - 不会坐下休息      （bot_ai.cpp:5970  CanSit() && !IsWanderer()）
#        - 强制开启PvP状态   （bot_ai.cpp:14888 SetPvP(... || IsWanderer())）
#        - 跟随距离更远      （bot_ai.cpp:4323  followdist + 10）
#        - 追击/复活计时不同 （bot_ai.cpp:15732 / 15876）
#
#    【最重要的一条】
#        游荡bot是动态生成的，没有 SpawnId，不在 creature 表里。
#        服务器重启后这个bot不会以同样身份回来。
#        所以：适合临时拉一个打一场，不适合长期培养。
#
#    这些不是本补丁引入的缺陷，是游荡bot的固有性质。
#    想要一个能长期用的bot，还是用 NPCBot 商人正常雇佣。
#

NpcBot.WanderingBot.AllowHire = 1
