[worldserver]

###############################################################################
# step34  伙伴关怀系统
#
# 放置位置：
#     D:\TC-Build\bin\RelWithDebInfo\worldserver.conf.d\npcbot_companion.conf
#
# 注意（踩过的坑）：
#     1. 必须有 [worldserver] 段头
#     2. 注释必须独立成行，不能写在配置行尾
#     3. 改完重启 worldserver
###############################################################################

#
#    NpcBot.Companion.Enable
#        伙伴关怀系统总开关。
#        开启后，队伍里的 bot 会主动观察你的状态：
#          - 你血少了，从自己包里拿食物给你
#          - 你法力低了，给你水
#          - 你钱不够了，塞给你一些金币
#          - 你升级了，说句祝贺
#          - 你死后复活，会关心你一句
#          - 没事的时候，聊聊见闻
#
#        所有台词都在数据库 `npcbot_care_text` 表里，可以随时增删改，
#        改完不用重新编译，重启服务端即可。
#
#        Default: 1 (开启)
#

NpcBot.Companion.Enable = 1

#
#    NpcBot.Companion.Cooldown
#        两次关怀之间的最短间隔（毫秒）。
#        防止 bot 变成话痨。
#
#        Default: 120000 (2分钟)
#

NpcBot.Companion.Cooldown = 120000

#
#    NpcBot.Companion.ChatCooldown
#        闲聊（讲见闻）的单独冷却（毫秒）。
#        比关怀冷却长，因为闲聊不解决实际问题，说多了烦。
#
#        Default: 600000 (10分钟)
#

NpcBot.Companion.ChatCooldown = 600000

#
#    NpcBot.Companion.HealthPct
#        主人血量低于百分之多少时，bot 会递食物。
#
#        Default: 50
#

NpcBot.Companion.HealthPct = 50

#
#    NpcBot.Companion.ManaPct
#        主人法力低于百分之多少时，bot 会递水。
#        只对有法力条的职业生效。
#
#        Default: 40
#

NpcBot.Companion.ManaPct = 40

#
#    NpcBot.Companion.MoneyThreshold
#        主人身上的钱少于这个数（铜）时，bot 会给钱。
#        设成 0 表示关闭"给钱"这一项。
#
#        换算：1金 = 10000铜
#        Default: 100000 (10金)
#

NpcBot.Companion.MoneyThreshold = 100000

#
#    NpcBot.Companion.MoneyGive
#        每次给多少钱（铜）。
#
#        换算：1金 = 10000铜
#        Default: 50000 (5金)
#

NpcBot.Companion.MoneyGive = 50000
