########################################################################
#  step45  NPCBot 数量上限
#
#  【纯配置，不用编译】改完重启 worldserver 即可生效。
#
#  放到：  worldserver.conf.d\npcbot_maxbots.conf
#  注意：  文件必须有 [worldserver] 段头，否则整个文件不加载
#          注释必须独立成行，不能写在配置值后面
########################################################################

[worldserver]

########################################################################
#  一、每个等级段最多带几个 bot
#
#  【必须正好 9 个值】—— 少一个多一个都会 ASSERT 直接崩服
#      botconfig.cpp:470
#      ASSERT(toks0.size() == BRACKETS_COUNT, "NpcBot.MaxBots must have exactly %u values")
#
#  9 个值对应 9 个等级段（botcommon.h:29 的注释）：
#      0-9, 10-19, 20-29, 30-39, 40-49, 50-59, 60-69, 70-79, 80-83
#
#  【硬上限 39】—— botconfig.cpp:486
#      if (uval >= MAX_RAID_SIZE)  uval = MAX_RAID_SIZE - 1;
#      MAX_RAID_SIZE = 40 (Group.h:44)
#      40 是团队人数上限，减去你自己 = 39。
#      写 50 也会被强制压回 39，不会报错但也不会生效。
#
#  【建议递增】—— 低级少给，高级给满。
#      不然 1 级小号带 39 个 bot 碾压新手村，没意思。
#      写成递减会有 WARN 日志（botconfig.cpp:482），但不会崩。
########################################################################

# 默认（上游）：1,1,1,1,1,1,1,1,1   —— 全程只能带 1 个

# 推荐配置：循序渐进，满级给满
NpcBot.MaxBots = 2,3,4,5,10,15,20,25,39

# 其它口味，按需替换上面那行：
#
# 保守（想保留单人体验）：
# NpcBot.MaxBots = 1,1,2,2,3,3,4,4,5
#
# 一队人（5人本刚好）：
# NpcBot.MaxBots = 2,2,3,4,4,4,4,4,4
#
# 团本级（一开始就给满）：
# NpcBot.MaxBots = 39,39,39,39,39,39,39,39,39


########################################################################
#  二、每个职业最多几个
#
#  botconfig.cpp:317   默认 1
#
#  默认只能带 1 个法师、1 个牧师……想凑 5 个法师团就要改这个。
#  0 = 不限制（但仍受上面 MaxBots 总数约束）
########################################################################

NpcBot.MaxBotsPerClass = 5


########################################################################
#  三、每个账号总上限
#
#  botconfig.cpp:318   默认 0 = 不限
#
#  这是【跨角色】的总数。比如你一个账号有 5 个角色，
#  设成 10 的话，5 个角色加起来最多 10 个 bot。
#
#  单人服建议保持 0。
########################################################################

NpcBot.MaxBotsPerAccount = 0


########################################################################
#  四、改完怎么验证
#
#  1. 重启 worldserver
#  2. 启动日志里【不能】有这两行：
#         NpcBot.MaxBots must have exactly 9 values      <- 值的个数不对，会崩
#         NpcBot.MaxBots value at offset N is X > 39     <- 超39被强制压回
#  3. 游戏里 .npcbot add 多招几个试试
#  4. 招到上限时会提示 "You can't have more than N bots"
#
#  【如果服务端启动就崩】：先检查是不是没写满 9 个值。
########################################################################
