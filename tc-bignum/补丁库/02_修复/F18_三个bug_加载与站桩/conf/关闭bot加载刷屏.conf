###############################################################################
#  F18  关闭 NPCBot 日志刷屏  【第3版 —— 前两版都错了，这版有源码实证】
###############################################################################
#
#  【我前两版的错误，先说清楚】
#
#  第1版：给了你一行本来就有的 Logger.npcbots  -> duplicate key -> 闪退
#
#  第2版：我说「Logger.npcbots=2 是 Warn 级，已经挡住 Debug」
#         —— 这句话【完全说反了】。
#
#  【实证】src/common/Logging/Logger.cpp:51
#      void Logger::write(LogMessage* message) const
#      {
#          if (!level || level > message->level || message->text.empty())
#              return;                       <-- 只有 level > 消息级别 才丢弃
#          ...
#      }
#
#  src/common/Logging/LogCommon.h:26-32
#      LOG_LEVEL_DISABLED = 0
#      LOG_LEVEL_TRACE    = 1
#      LOG_LEVEL_DEBUG    = 2
#      LOG_LEVEL_INFO     = 3
#      LOG_LEVEL_WARN     = 4
#      LOG_LEVEL_ERROR    = 5
#      LOG_LEVEL_FATAL    = 6
#
#  所以 Logger.xxx=N 的含义是【N 级及以上才输出】，数字越小越啰嗦：
#      =2  DEBUG及以上都输出   <- 最吵，你现在就是这个
#      =4  WARN及以上才输出    <- 挡掉 DEBUG 和 INFO
#      =0  完全关闭
#
#  你的 Logger.npcbots=2 正好把所有 bot DEBUG 日志全放出来了。
#
###############################################################################


###############################################################################
#  你日志里的 5 类刷屏，逐条对应源码
###############################################################################
#
#   类型                          出处                          logger
#  --------------------------------------------------------------------------
#  1. XXX KILLED YYY             bot_ai.cpp:15922 / :15930     npcbots (DEBUG)
#  2. XXX WAS KILLED BY YYY      bot_ai.cpp:15869              npcbots (DEBUG)
#  3. TELEPORTING to node ...    bot_ai.cpp:18636              npcbots (DEBUG)
#  4. can't find full path ...   bot_ai.cpp:18866              npcbots (DEBUG)
#  5. AuraEffect ... does not
#     have triggered spell       SpellAuraEffects.cpp:5056     spells.aura.effect.nospell (WARN)
#
#  前 4 类全是 npcbots 的 DEBUG  -> 改 Logger.npcbots 一行就全没了
#  第 5 类是独立 logger 的 WARN  -> 要单独关
#
###############################################################################


###############################################################################
#  第一步：改这一行（是【改】不是【加】，你的 conf 里已有）
###############################################################################
#
#  找到 worldserver.conf 里的（约 4013 行）：
#
#      Logger.npcbots=2,NpcBots Server
#
#  改成：
#
#      Logger.npcbots=4,NpcBots Server
#
#  这一改，上面 1-4 类刷屏全部消失，只保留 WARN/ERROR/FATAL。
#
#  【不要新增这一行】—— 直接把原来那行的 2 改成 4。
#  重复键会导致 "duplicate key name" 启动即退（第1版的教训）。
#
###############################################################################


###############################################################################
#  第二步：关掉第 5 类（AuraEffect 法术警告）
###############################################################################
#
#  这一项你的 conf 里【应该没有】，先确认：
#      grep -n "spells.aura.effect.nospell" worldserver.conf
#  没有输出才加下面这行。

Logger.spells.aura.effect.nospell=0


###############################################################################
#  第三步（可选）：F18 批量出场配置
###############################################################################
#
#  这两项是全新的，先确认没有：
#      grep -n "NpcBot.WanderingBots.Spawn" worldserver.conf

NpcBot.WanderingBots.SpawnDelayMs = 50
NpcBot.WanderingBots.SpawnBatch = 10


###############################################################################
#  第四步：验证
###############################################################################
#
#  改完重启，控制台应该只剩：
#      Starting NpcBot system...
#      >> Loaded N bot data entries
#      >> Spawned N npcbot(s) within N grid(s) in N ms
#      Spawning wandering bots...
#      >> Set up spawning of N wandering bots in N ms
#
#  这几行是 BOT_LOG_INFO（级别3），Logger.npcbots=4 会把它们也挡掉。
#
#  【如果你想保留这些汇总行】，用 =3 而不是 =4：
#      Logger.npcbots=3,NpcBots Server
#  这样 INFO 汇总行保留，DEBUG 刷屏消失。
#
#  我的建议：先用 3，既干净又能看到加载进度。
#
###############################################################################


###############################################################################
#  附：为什么不能靠 Appender 挡
###############################################################################
#
#  你的 conf：
#      Appender.NpcBots=1,2,0        <- 第2个数字 2 = Appender 也是 DEBUG 级
#      Appender.Console=1,3,0,...    <- Console 是 INFO 级
#
#  Logger 和 Appender 都有级别，消息要【两关都过】才输出。
#  但 Logger 那一关在前（Logger.cpp:51 直接 return），
#  所以改 Logger 最有效，不用动 Appender。
#
###############################################################################
