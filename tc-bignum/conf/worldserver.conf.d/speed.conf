###############################################################################
#
#   战斗节奏优化  (speed.conf)
#
#   把 GCD / 读条 / 单技能CD 按百分比缩放，让战斗不那么"站桩"，
#   但保留节奏感 —— 不是 .cheat cooldown 那种一刀切归零。
#
#   本文件与档位文件（epic.conf 等）同时生效、互不干扰。
#   改完执行 .reload config 即可生效，不用重启。
#
###############################################################################

[worldserver]

#==============================================================================
#  总开关
#==============================================================================

# 0 = 完全关闭，恢复原版
Speed.Enable = 1


#==============================================================================
#  三层缩放（百分比，100 = 原版）
#==============================================================================

# GCD 全局冷却
#   1.5s -> 0.9s，1.0s -> 0.6s
#   这是"站桩感"的主要来源
Speed.Gcd = 60

# 读条时间
#   火球术 3.5s -> 2.6s
#   为什么是 75 而不是 60：
#     近战技能瞬发，卡在 GCD；法系主力要读条，卡在读条。
#     只压 GCD 的话近战快 1.67 倍，法师火球术一点没变快，法系会被落下。
#     压到 75% 让法系提速 1.33 倍，同时保留"读条职业要站着念"的特性。
Speed.Cast = 75

# 单技能CD 总倍率（100 = 只用下面的分段值，不额外缩放）
Speed.Cd = 100


#==============================================================================
#  地板（毫秒，防止压到没有）
#==============================================================================

# GCD 最低值。低于 300ms 技能特效会重叠，观感变差
Speed.GcdFloor = 300

# 读条最低值。低于 500ms 读条条几乎看不见
Speed.CastFloor = 500

# 读条不压到低于 GCD  【建议开启】
#   原理：读条比 GCD 短的那部分是白给的——技能念完了但 GCD 没转好，
#         还是得干等。压到低于 GCD 毫无意义，还会让读条条一闪而过。
#   例：1秒读条的技能，压75%变750ms，但GCD是900ms，那150ms完全白压。
#       开启后停在900ms，正好和GCD齐平。
#   注意：原读条本来就低于GCD的技能（如0.8秒读条）不受影响。
Speed.CastNotBelowGcd = 1

# 单技能CD 最低值
Speed.CdFloor = 3000


#==============================================================================
#  单技能CD 分段缩放
#
#  为什么分段：CD 缩放对长CD是放大效应。
#  5分钟技能压85%直接少45秒，比15秒技能少2秒明显得多。
#  长CD少压一点，保留"大招"的稀有感。
#==============================================================================

# CD < 30 秒
Speed.Cd.Short = 85

# CD 30 秒 ~ 3 分钟
Speed.Cd.Medium = 80

# CD > 3 分钟（大招，少压）
Speed.Cd.Long = 90

# 小于这个值的CD完全不缩放（毫秒）
Speed.Cd.MinScale = 3000


#==============================================================================
#  急速影响近战 GCD  【修复原版设计缺陷】
#
#  原版 Spell.cpp:8648 的判定把物理职业排除在外了：
#      if (StartRecoveryCategory == 133 && StartRecoveryTime == 1500 &&
#          DmgClass != MELEE && DmgClass != RANGED && !HasAttribute(ABILITY))
#
#  结果：法师堆急速能把 GCD 压到 1.0s，
#        而战士堆到 100% 急速，GCD 还是死板的 1500ms。
#
#  开启后拉平这个差距。注意这不是给近战开挂，
#  是把本来就歪的地方拉直。
#==============================================================================

Speed.HasteAffectsMelee = 1


#==============================================================================
#  PVP 保护
#
#  1 = 战场/竞技场内恢复原版数值
#  PVP 更多是拼操作，加速会破坏平衡
#==============================================================================

Speed.PvpRestoreOriginal = 1


#==============================================================================
#  白名单（这些技能不缩放，避免破坏机制）
#==============================================================================

# 复活类（战复、军团复活、重生等）
# 压了会破坏副本机制
Speed.Exempt.Resurrect = 1

# 传送类（炉石、传送门、绑定）
# 压了能无限跑图
Speed.Exempt.Teleport = 1


#==============================================================================
#  按职业单独设置（0 = 用上面的全局值）
#
#  职业ID: 1战士 2圣骑 3猎人 4盗贼 5牧师 6死骑 7萨满 8法师 9术士 11德鲁伊
#
#  建议：物理职业的站桩感比法系严重（法系至少有读条填充时间），
#        如果觉得近战还是不够顺，可以单独调低。
#==============================================================================

Speed.Gcd.Class1 = 0
Speed.Gcd.Class2 = 0
Speed.Gcd.Class3 = 0
Speed.Gcd.Class4 = 0
Speed.Gcd.Class5 = 0
Speed.Gcd.Class6 = 0
Speed.Gcd.Class7 = 0
Speed.Gcd.Class8 = 0
Speed.Gcd.Class9 = 0
Speed.Gcd.Class11 = 0

Speed.Cast.Class2 = 0
Speed.Cast.Class5 = 0
Speed.Cast.Class7 = 0
Speed.Cast.Class8 = 0
Speed.Cast.Class9 = 0
Speed.Cast.Class11 = 0
