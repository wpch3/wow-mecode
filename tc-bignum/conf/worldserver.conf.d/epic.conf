###############################################################################
#
#   史诗档 · 剧情推荐
#
#   为《真龙纪元》设计。保留成长/探索/剧情，但该省时间的照样省。【推荐】
#
#   【用法】把本文件放进  worldserver.conf.d\  目录，
#           同目录下只保留这一个档位文件，其余的移走或改成 .txt 后缀。
#           服务端启动时自动加载，覆盖 worldserver.conf 的同名项。
#
#   本文件只含【差异项】，你原有的 worldserver.conf 完全不用动。
#
###############################################################################

[worldserver]


#==============================================================================
#  安全与修正（五档统一，都必须修）
#==============================================================================

# 崩溃看门狗。你原本 0=关闭，服务端卡死不会自救
MaxCoreStuckTime = 60

# 加速外挂检测。你原本 0=关闭
MaxOverspeedPings = 2

# 你原本是 8=FFA全场混战。0=PVE 1=PVP 4=RPPVP 8=FFAPVP
GameType = 0

# 你原本 100=物理免疫，且与 NpcBot 的 95 不一致
Stats.Limits.Dodge = 95.0

Stats.Limits.Parry = 95.0

Stats.Limits.Block = 95.0

Stats.Limits.Crit = 95.0

# 室内判定。关闭会导致室内骑马/坐标异常
vmap.enableIndoorCheck = 1

# 刷屏防护
ChatFlood.MessageCount = 10

ChatFlood.MuteTime = 10

# 你原本只填了 Enable，补上配套的 Level
Random.ItemStats.Level = 200


#==============================================================================
#  剧情体验
#==============================================================================

# 2=全跳过会把你写的剧情CG跳掉；0=播放(玩家仍可ESC跳)
SkipCinematics = 0

# 地图全开会让浅湾/无名山谷的发现感消失
PlayerStart.MapsExplored = 0

# 声望全满会让剧情的阵营线直接失效
PlayerStart.AllReputation = 0

# 全技能会让 .bar auto 智能配栏失去意义
PlayerStart.AllSpells = 0


#==============================================================================
#  副本门槛
#==============================================================================

# 1级号能进ICC → 刷本解锁套装形同虚设
Instance.IgnoreLevel = 0

# 单人进团本
Instance.IgnoreRaid = 0

# 单人做团本任务
Quests.IgnoreRaid = 0

Rate.InstanceResetTime = 0.25

AccountInstancesPerHour = 30


#==============================================================================
#  成长曲线
#==============================================================================

Rate.XP.Kill = 1

Rate.XP.Quest = 1

Rate.XP.Explore = 1

AlwaysMaxSkillForLevel = 0

AlwaysMaxWeaponSkill = 0

SkillGain.Weapon = 5

SkillGain.Defense = 5

SkillGain.Crafting = 10

SkillGain.Gathering = 10

# 主专业数量。原版2
MaxPrimaryTradeSkill = 4

MinDualSpecLevel = 30

CharacterCreating.MinLevelForDeathKnight = 55

NoResetTalentsCost = 1


#==============================================================================
#  死亡惩罚
#==============================================================================

# 复活虚弱起始等级。120=永不触发
Death.SicknessLevel = 60

DurabilityLoss.OnDeath = 5

# 修理费倍率
Rate.RepairCost = 0.3

Rate.Damage.Fall = 0.5


#==============================================================================
#  经济
#==============================================================================

# 出生金币(铜)。100万=100金
StartPlayerMoney = 100000

StartDeathKnightPlayerMoney = 200000

Rate.Quest.Money.Reward = 5

Rate.Quest.Money.Max.Level.Reward = 5

Rate.Drop.Money = 3

MailDeliveryDelay = 1


#==============================================================================
#  掉落
#==============================================================================

Rate.Drop.Item.Poor = 1

Rate.Drop.Item.Normal = 2

Rate.Drop.Item.Uncommon = 3

Rate.Drop.Item.Rare = 3

# 紫装。刷装备是核心玩法，史诗档保留高倍率
Rate.Drop.Item.Epic = 5

Rate.Drop.Item.Legendary = 10

Rate.Drop.Item.Artifact = 10

Rate.Drop.Item.Referenced = 3


#==============================================================================
#  便利性
#==============================================================================

AllFlightPaths = 1

InstantFlightPaths = 1

Rate.Rest.InGame = 2

MinPetitionSigns = 0

Rate.Reputation.Gain = 2


#==============================================================================
#  世界氛围
#==============================================================================

# 天气。剧情里"那天下雨了"是重要场景
ActivateWeather = 1

ChangeWeatherInterval = 600000

Corpse.Decay.NORMAL = 600


#==============================================================================
#  NPCBot
#==============================================================================

# 每职业bot上限。剧情核心是跨阵营合作，bot太多没人找真人
NpcBot.MaxBots = 15,15,15,15,15,15,15,15,15

NpcBot.Cost.Hire = 10000

NpcBot.Limit.Dungeon = 0

NpcBot.Limit.Raid = 0
