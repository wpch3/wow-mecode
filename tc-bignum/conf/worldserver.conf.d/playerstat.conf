[worldserver]

###################################################################################################
# GM 属性修改持久化
#
# 解决 .modify stat / .set crit 改的属性【重登就没了】的问题。
#
# 根因：这两个命令只改内存（SetStatFlatModifier / ApplyRatingMod），
#       characters 表里没有存这些修正值的字段，所以不会被保存。
#
# 开启后：改动会写进 characters.custom_playerstat，
#         每次登录自动重新应用。
###################################################################################################

# 总开关
#     0 = 关闭，恢复原版行为（改了重登失效）
#     1 = 开启，改动永久保留
# 默认 1
PlayerStat.Persist = 1

###################################################################################################
# 说明
#
# 和 Solocraft 不冲突：
#     Solocraft 用 SetStatPctModifier（百分比槽）
#     本模块用 SetStatFlatModifier（固定值槽）
#     两者是不同槽位，互不覆盖。
#
# 想清掉某个角色的所有加成：游戏内 .modify clear 或 .set clear
#
# 想全服清空：
#     TRUNCATE TABLE characters.custom_playerstat;
#     然后重启服务器
###################################################################################################
