[worldserver]

###################################################################################################
# 老职业技能强化
#
# 给原版 10 个职业补功能位，不是单纯加伤害。
# 全部是【放大现有法术】，零 DBC 成本，玩家不用下补丁。
#
# 原理：SpellMgr.h:671 的 _GetSpellInfo() 是非 const 的，
#       服务端启动时可以改写任何现有法术的数值和冷却。
#       客户端只负责画图标播动画，实际结算全在服务端。
#
# 【改完必须重启】法术数据在服务器启动时加载，.reload config 无效。
###################################################################################################

# 总开关
#     0 = 全关，所有法术恢复原版
#     1 = 开启
# 默认 1
CustomSpell.Enable = 1

# 全局倍率
#     在每条改动的基础上再乘一次，方便整体收放。
#     1.0 = 按设计值
#     0.5 = 只要一半强度
#     2.0 = 加倍（不推荐，你还有 Solocraft 5-40 倍叠加）
#     范围 0.1 - 10.0
# 默认 1.0
CustomSpell.GlobalScale = 1.0

###################################################################################################
# 分职业开关
#
# 某个职业觉得过强/过弱，单独关掉它，其余不受影响。
###################################################################################################

# 战士 —— 补远程手段（投掷x3）、AOE、团队增益
CustomSpell.Warrior = 1

# 圣骑士 —— 补范围输出、缩短保命CD
CustomSpell.Paladin = 1

# 猎人 —— 补爆发、多重射击目标数
CustomSpell.Hunter = 1

# 盗贼 —— 补AOE（剑刃乱舞CD减半）、团队增益
CustomSpell.Rogue = 1

# 牧师 —— 神圣新星x3、群疗强化
CustomSpell.Priest = 1

# 死亡骑士 —— 亡者大军8只改10只、疾病强化
CustomSpell.DeathKnight = 1

# 萨满 —— 治疗链+3跳、闪电链+2跳、嗜血CD缩短
CustomSpell.Shaman = 1

# 法师 —— 补生存（法力护盾x2）、闪现CD减半
CustomSpell.Mage = 1

# 术士 —— 强化吸血、地狱火CD缩短
CustomSpell.Warlock = 1

# 德鲁伊 —— 群疗强化、野性成长+2目标
CustomSpell.Druid = 1

###################################################################################################
# 说明：和其他系统的叠加
#
# 你的服务器有这些会叠加的东西，设计时已考虑：
#   Solocraft      5-40 倍属性
#   speed.conf     CD 压缩到 85%/80%/90%
#   大数值改造     装备属性上限 21 亿
#
# 所以这里用的是【温和倍率】（多数 1.3-1.5 倍），
# 而不是文档里写的理论值。觉得不够爽就调 GlobalScale。
#
# 所有数值都有 int32 溢出保护（21亿封顶，不会回绕成负数）。
###################################################################################################
