[worldserver]

###################################################################################################
# 套装/配装系统  .gearset
#
# 放置：D:\TC-Build\bin\RelWithDebInfo\worldserver.conf.d\gearset.conf
#
# 注意：
#   - 这个文件必须有上面的 [worldserver] 段头，否则不生效
#   - 注释必须独立成行，行尾写 # 不认
#   - 改完要重启 worldserver（部分项 .reload config 不够）
###################################################################################################


###################################################################################################
# 按等级推荐装备
#
#     0 = 不限等级，永远发最好的（80级装备也发给20级号，穿不上但能看）
#     1 = 只发当前等级穿得上的
#
# 说明：
#   ItemLevel（装等）和 RequiredLevel（需求等级）是两回事。
#   开启后会用 RequiredLevel 过滤，20 级角色不会再拿到 80 级才能穿的装备。
#
# 默认 1
###################################################################################################

GearSet.MatchLevel = 1


###################################################################################################
# 护甲类型说明（无需配置，自动处理）
#
# 3.3.5 的护甲精通是 40 级才学的：
#
#     战士 / 圣骑士     1-39 级 -> 锁甲      40 级起 -> 板甲
#     猎人 / 萨满       1-39 级 -> 皮甲      40 级起 -> 锁甲
#     死亡骑士          出生即 55 级         直接板甲
#     盗贼 / 德鲁伊     全程皮甲
#     牧师 / 法师 / 术士 全程布甲
#
# 系统会实际查询玩家【学没学会】对应的护甲精通技能，
# 没学会就自动退一档，不会发穿不上的装备。
#
# 因为是查技能而不是写死等级，所以你以后改了技能学习等级也能自动适配。
###################################################################################################
