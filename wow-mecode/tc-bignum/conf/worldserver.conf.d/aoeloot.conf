[worldserver]

###################################################################################################
# AoE Loot 群体拾取
#
# 拾取一具尸体时，自动把周围所有「属于你的」尸体一起收了。
# 本服自定义实现，不是上游 TrinityCoreCustomChanges 的版本。
#
# 改完执行 .reload config 即可生效，不用重启。
###################################################################################################

# 总开关
#     0 = 关闭（完全恢复原版逐具拾取）
#     1 = 开启
# 默认 1
AoELoot.Enable = 1

# 拾取半径（码）
#     30  = 上游默认，约一屏
#     60  = 本服默认，刷材料不用聚怪
#     100 = 很大，适合大范围清场
#     允许范围 5 - 200，超出会被自动钳制
# 半径越大网格遍历开销越大，不建议超过 100
# 默认 60
AoELoot.Range = 60

# 组队时是否生效
#     0 = 组队时关闭，恢复逐具拾取
#     1 = 组队时也生效（有越权保护，不会抢队友的）
#
# 说明：开启也不会抢队友东西。代码里对每具尸体都调用了
# Player::isAllowedToLoot()，五种分配方式全部兼容：
#     自由拾取   -> 先到先得（暴雪原意，本来就该这样）
#     轮抽       -> 只收轮到你的那些
#     队长分配   -> 受 permission 二次限制
#     组队/需求  -> 轮抽逻辑 + 超阈值物品走 roll
#     剥皮       -> 只有本人能收
#
# 另外：NPCBot 会被算进真实队伍，但本模块只看「真人队友」，
# 所以你带一队 bot 刷怪时，等同单人，全量拾取。
# 默认 1
AoELoot.InGroup = 1

# 组队时是否跳过需要 roll 的物品
#     0 = 不跳过，能收的都收（可能让队友看不到 roll 窗口）
#     1 = 跳过超阈值物品，留给正常 roll 流程
#
# 只在 组队拾取 / 需求优先 / 队长分配 三种模式下起作用。
# 建议保持 1，否则队友会觉得紫装莫名消失。
# 默认 1
AoELoot.SkipRollItems = 1

# 背包满时把多余物品邮寄给自己
#     0 = 不邮寄，装不下的留在尸体上
#     1 = 邮寄（发件人是 34337 邮政官）
#
# 每封邮件最多 12 件，超出自动分多封；
# 超过最大堆叠数的会自动拆堆。
# 默认 1
AoELoot.MailExcess = 1

# 单次最多处理多少具尸体
#     防止 AOE 秒杀一大片后卡顿。
#     允许范围 1 - 500
# 默认 50
AoELoot.MaxCorpses = 50

# 是否在聊天框播报本次拾取汇总
#     0 = 安静
#     1 = 显示「群体拾取：额外收取 N 具尸体，共 M 件物品」
# 默认 1
AoELoot.Announce = 1

###################################################################################################
