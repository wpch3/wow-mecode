###############################################################################
#
# G11 第2步：附近玩家只读感知层
#
# 本文件只控制“观察并写日志”，不会让 NPCBot 移动、说话、攻击、治疗、
# 组队、修改羁绊或写数据库。源码还会强制 ReadOnly=1，防止误配置解锁行为。
#
# 安装后先保持 Enable=0 完成编译；准备验收时改为 1，再重启 worldserver。
#
###############################################################################

[worldserver]

# 总开关：0=关闭，1=启用只读感知日志
NpcBot.Autonomy.Perception.Enable = 0

# 搜索半径（码）；源码强制限制为 10..120
NpcBot.Autonomy.Perception.Range = 60

# 每只自由游荡 NPCBot 的随机扫描间隔（毫秒）；源码限制为 1000..60000
# 使用随机区间可避免大量 bot 在同一个 world tick 同时扫描。
NpcBot.Autonomy.Perception.IntervalMin = 4000
NpcBot.Autonomy.Perception.IntervalMax = 8000

# 同一 bot 对同一玩家的最短重复日志间隔（毫秒）；源码限制为 1000..300000
NpcBot.Autonomy.Perception.LogCooldown = 15000

# 第2步必须为 1。即使误设为0，源码也会强制改回只读并打印警告。
NpcBot.Autonomy.Perception.ReadOnly = 1
