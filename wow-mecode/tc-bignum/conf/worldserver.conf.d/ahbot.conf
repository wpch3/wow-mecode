###############################################################################
#
#   拍卖行大改 · G16 第1步 + 第3步 + 共享拍卖行十万挂单修正版
#
#   解决三个问题：
#     1. 「数据库只有 37,500 条」 -> 跨阵营模式下三行实际共用一个池
#     2. 「真正接近十万条」       -> 只开 Neutral，Ratio=250，目标 99,250
#     3. 「很杂乱」               -> 用等级/类别过滤控制分布
#
#   【2026-08-19 权威更正】
#   AllowTwoSide.Interaction.Auction=1 时，联盟/部落/中立都返回同一个
#   mNeutralAuctions。旧配置 100/100/100 不会得到三个独立的 39,700；
#   .ahbot status 还会把同一个池显示三次。源码实证与只读 SQL 见：
#   规划/G16_bot经济与打工/11-共享拍卖行只有37500条_根因与十万挂单修复.md
#
#   【用法】把本文件放进  worldserver.conf.d\  目录即可。
#           你的 worldserver.conf 一个字都不用改。
#           本文件里的项会【覆盖】主 conf 的同名项。
#
#   【为什么能覆盖】实查 Main.cpp:203 LoadAdditionalDir(configDir, true, ...)
#           -> Config.cpp:158 LoadAdditionalFile
#           -> _config.put_child(...)   put_child 是覆盖写入，后加载的赢
#
#   【重要】本文件与档位文件（epic.conf 等）是【并列】关系，互不冲突：
#           已实查 12 个档位文件，AuctionHouseBot 出现 0 次。
#
###############################################################################

[worldserver]


#==============================================================================
#  一、跨阵营共享拍卖行：只启用 Neutral，并把唯一池放大到约十万条
#==============================================================================
#
#  主配置 AllowTwoSide.Interaction.Auction = 1。
#  实查 AuctionHouseMgr.cpp:58-61：开启后，不论查询联盟/部落/中立，
#  GetAuctionsMap() 都返回同一个 mNeutralAuctions。
#
#  因此必须按上游说明只启用 Neutral：
#    Alliance=0 / Horde=0 / Neutral=250
#
#  七个 Items.Amount.* 合计 39,700；250% 的唯一目标为：
#    39,700 x 2.5 = 99,250 条 AHBot 挂单。
#
#  注意：跨阵营模式下 .ahbot status 的三列数量可能仍是同一个池的重复显示，
#  不要相加；真实唯一数量用规划目录的 12-共享拍卖行_只读诊断.sql 查询。

AuctionHouseBot.Alliance.Items.Amount.Ratio = 0

AuctionHouseBot.Horde.Items.Amount.Ratio = 0

AuctionHouseBot.Neutral.Items.Amount.Ratio = 250


#==============================================================================
#  二、去杂乱：等级过滤（「很杂乱」的根因）
#==============================================================================
#
#  你的现值四个全是 0。实查 AuctionHouseBotSeller.cpp:238-253 的写法：
#      if (uint32 value = sAuctionBotConfig->GetConfig(CONFIG_AHBOT_ITEM_MIN_ITEM_LEVEL))
#          if (prototype->GetBaseItemLevel() < value)
#              continue;
#  这是 C++ 的「条件内赋值」写法：value 为 0 时整个 if 判定为假，
#  过滤【被跳过】。所以 0 = 不过滤，1级破布和80级紫装全混在一起。
#
#  ################  必读：这组过滤只管武器和护甲  ################
#
#  实查 AuctionHouseBotSeller.cpp:235-236，这段过滤在
#      case ITEM_CLASS_ARMOR:
#      case ITEM_CLASS_WEAPON:
#  这两个 case 里面。
#
#  也就是说：布料、矿石、药水、宝石【不受下面 ItemLevel 影响】，
#  不会因为设了 Min=15 就把亚麻布过滤掉。可以放心设。
#
#  ##############################################################

# 装等下限。15 以下基本是 1-10 级的垃圾白装
AuctionHouseBot.Items.ItemLevel.Min = 15

# 装等上限。284 = ICC 25H 顶级装等，再高的都是测试物品
AuctionHouseBot.Items.ItemLevel.Max = 284

# 需求等级下限【必须保持 0】
#   实查 :244  if (value) if (GetRequiredLevel() < value) continue;
#   材料/药水的 RequiredLevel 就是 0，一旦设成非 0，
#   这些东西会在 ITEM_CLASS_CONSUMABLE 分支(:262)被全部过滤掉 -> 反而更"不齐全"
AuctionHouseBot.Items.ReqLevel.Min = 0

# 需求等级上限。超过 80 的都是异常数据
AuctionHouseBot.Items.ReqLevel.Max = 80


#==============================================================================
#  三、金色战刃消失（拾取绑定装备不该出现在拍卖行）
#==============================================================================
#
#  实查 AuctionHouseBotSeller.cpp:138-140
#      case BIND_WHEN_PICKED_UP:
#          if (!sAuctionBotConfig->GetConfig(CONFIG_AHBOT_BIND_PICKUP))
#              continue;
#  你现值 = 1，所以所有"拾取后绑定"的装备都会上架。
#
#  【你的 forceIncludeItems 359 项不受影响】
#  实查 :123-129，白名单是 push_back + continue，
#  在绑定过滤(:132)【之前】就入池了，根本走不到这里。
#  所以你那 233 项 WLK 坐骑照常上架。

AuctionHouseBot.Bind.Pickup = 0


#==============================================================================
#  四、补上漏掉的一大批物品
#==============================================================================
#
#  实查 AuctionHouseBotSeller.cpp:222-230
#      if (!GetConfig(CONFIG_AHBOT_ITEMS_MISC))
#      {
#          bool const isVendorItem = npcItems.count(itemId) > 0;
#          bool const isLootItem   = lootItems.count(itemId) > 0;
#          if (!isLootItem && !isVendorItem) continue;
#      }
#  你现值 = 0，意思是「只挂商人卖的 + 怪物掉的」，
#  凡是不在这两张表里的物品全被扔掉 -- 这砍掉了很大一批。

AuctionHouseBot.Items.Misc = 1


#==============================================================================
#  五、补货速度（决定多久能铺满）
#==============================================================================

# 冷启动时每周期补多少件。你现值 200，太慢了
AuctionHouseBot.ItemsPerCycle.Boost = 5000

# 稳定后每周期补多少件。你现值 20
AuctionHouseBot.ItemsPerCycle.Normal = 500

# 补货间隔（秒）。你现值 1600。
#
#   【第一次铺货请临时改成 60】，铺满之后再改回 3600。
#   原因：目标 12 万条挂单，按 3600 秒补 5000 件算要 24 小时才能铺满。
#   改 60 的话大约 25 分钟铺满，然后一定要改回来（否则 CPU 一直在跑补货）。
#
AuctionHouseBot.Update.Interval = 60


#==============================================================================
#  六、每个品质的基础预算（由 Neutral Ratio=250 放大）
#==============================================================================
#
#  七项基础合计为 39,700。当前只启用一个共享 Neutral 池，
#  由上面的 250% 放大为约 99,250 条，不再乘以三个阵营。
#
#  理论品质目标：灰 5,000 / 白 30,000 / 绿 30,000 / 蓝 20,000 /
#                 紫 12,500 / 橙 1,250 / 黄 500。
#
#  【如果服务器卡】优先把 Neutral Ratio 从 250 调到 200（约79,400）或
#  150（约59,550），不要重新开启联盟/部落两个重复配置。

AuctionHouseBot.Items.Amount.Gray = 2000

AuctionHouseBot.Items.Amount.White = 12000

AuctionHouseBot.Items.Amount.Green = 12000

AuctionHouseBot.Items.Amount.Blue = 8000

AuctionHouseBot.Items.Amount.Purple = 5000

AuctionHouseBot.Items.Amount.Orange = 500

AuctionHouseBot.Items.Amount.Yellow = 200


#==============================================================================
#  七、材料成堆卖（不再是 1 个 1 个挂）
#==============================================================================
#
#  实查 AuctionHouseBotSeller.cpp:641-646
#      if (config.GetRandomStackRatioPerClass(ItemClass(proto->GetClass())) > urand(0, 99))
#          return urand(1, itemProto->GetMaxStackSize());
#      else
#          return 1;
#  这是百分比概率：100 = 总是随机堆叠，0 = 永远单个。
#
#  【武器/护甲/容器/配方/箭袋/雕文保持 0】
#  它们的 MaxStackSize 本来就是 1，urand(1,1) 恒等于 1，
#  设成 100 只是白白多跑一次随机数，没有任何效果。

AuctionHouseBot.Class.RandomStackRatio.Consumable = 100

AuctionHouseBot.Class.RandomStackRatio.Gem = 100

AuctionHouseBot.Class.RandomStackRatio.Reagent = 100

AuctionHouseBot.Class.RandomStackRatio.Projectile = 100

AuctionHouseBot.Class.RandomStackRatio.TradeGood = 100

AuctionHouseBot.Class.RandomStackRatio.Generic = 100

AuctionHouseBot.Class.RandomStackRatio.Quest = 100

AuctionHouseBot.Class.RandomStackRatio.Key = 100

AuctionHouseBot.Class.RandomStackRatio.Misc = 100


#==============================================================================
#  八、降低无意义品类的比重（进一步去杂乱）
#==============================================================================
#
#  实查 AuctionHouseBot.cpp:205-210，这几项是【优先级权重】，范围 0-10，
#  不是开关。计算方式见 AuctionHouseBotSeller.cpp:473：
#      weightedAmount = lroundf(classPrio / float(totalPrioPerQuality[j]) * qualityAmount);
#  设成 0 表示这一类分配到的配额为 0，几乎不会生成。
#
#  【安全性已验证】AuctionHouseBotSeller.cpp:463-464 有除零保护：
#      if (!totalPrioPerQuality[j]) continue;
#  只要不是把【所有】品类都设成 0，就不会出问题。这里只设 3 个。

# 任务物品不该出现在拍卖行
AuctionHouseBot.Class.Quest = 0

# 钥匙同理
AuctionHouseBot.Class.Key = 0

# 杂项：按用户最后决定保持 2。
#
# 坐骑属于 MISCELLANEOUS；因此 2 会让坐骑/宠物占比较低，但不会影响
# 总挂单约 99,250 的目标，只会把预算重新分给材料、武器、护甲等类别。
# 如果以后要增加坐骑占比，可单独把本项调高；不要把它和「总量只有37500」
# 混为一谈，后者的根因是跨阵营共享池和错误的 100/100/100 配置。
AuctionHouseBot.Class.Misc = 2


###############################################################################
#
#  改完之后做什么
#
#  【方式一】重启 worldserver（最稳）
#
#  【方式二】不重启，用两条命令（实查有效）：
#      .reload config      -> cs_reload.cpp:89，重新读磁盘上的所有 conf
#      .ahbot reload       -> cs_ahbot.cpp:124 -> AuctionHouseBot.cpp:478
#                             ReloadAllConfig() 会重建整个物品池
#      注意：必须【先】.reload config 再 .ahbot reload，顺序反了没用。
#      原因：AuctionHouseBot.h:240  void Reload() { GetConfigFromFile(); }
#            它只从内存里的 ConfigMgr 取值，不会自己去读磁盘。
#
#  然后：
#      .ahbot rebuild all  -> 把旧挂单标记为过期，并按 0/0/250 重建
#      .ahbot status all   -> 只确认 Ratio=0/0/250，不要把三列数量相加
#
#  从 37,500 增到约 99,250 的缺口约 61,750；Boost=5000 时理论约13轮。
#  用 12-共享拍卖行_只读诊断.sql 看真实唯一行数。
#  铺稳后把 Update.Interval 改回 3600，并再次 .reload config + .ahbot reload
#
###############################################################################
