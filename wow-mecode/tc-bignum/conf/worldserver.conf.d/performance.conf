###############################################################################
#
#   性能优化  (performance.conf)
#
#   针对「即将加入大量地图/模型/图标」这个场景。
#   这些配置现在感觉不到，但内容多了之后就是第一批瓶颈。
#
#   放进 worldserver.conf.d\ 即可，与档位文件、speed.conf 同时生效。
#
#   【重要】线程数请按你的 CPU 核数调整，见文件末尾的对照表。
#
###############################################################################

[worldserver]

#==============================================================================
#  多线程  【最关键的一组】
#==============================================================================

# 地图更新线程数
#   你原本是 1 —— 单线程跑所有地图更新。
#   加了大量自定义地图后，这是第一个撑不住的地方。
#   建议：CPU物理核数的一半，最少 2
MapUpdate.Threads = 2

# 网络 IO 线程
#   你原本是 2
ThreadPool = 4

# 数据库工作线程
#   你原本全是 1。加载 DBC/物品/生物、玩家数据读写都是单线程。
WorldDatabase.WorkerThreads = 2
WorldDatabase.SynchThreads = 2
CharacterDatabase.WorkerThreads = 2
CharacterDatabase.SynchThreads = 2
LoginDatabase.WorkerThreads = 1
LoginDatabase.SynchThreads = 1

# 网络线程
#   单机/好友服 1 够用；如果人多改 2
Network.Threads = 1


#==============================================================================
#  内存与卸载
#==============================================================================

# 副本卸载延迟
#   你原本 3600000（1小时）—— 副本空了还占1小时内存。
#   你要加很多副本的话，降到 15 分钟更合适。
Instance.UnloadDelay = 900000

# 网格清理间隔
#   你原本 300000（5分钟）
GridCleanUpDelay = 300000

# 网格卸载
#   1 = 开启（省内存）。自定义地图如果 NPC 稀疏，
#   频繁加载卸载反而抖动 —— 那时可以试试改 0。
GridUnload = 1


#==============================================================================
#  存档  【防丢数据】
#==============================================================================

# 玩家存档间隔
#   你原本 900000（15分钟）—— 崩溃会丢 15 分钟进度。
#   改成 5 分钟，磁盘压力可以忽略。
PlayerSaveInterval = 300000


#==============================================================================
#  可视距离
#
#  你原本大陆 100 码。剧情里有"八万人聚集"这种大场景，
#  100 码看不到远处。但调大 = 服务端压力剧增。
#
#  建议：保持 100，需要大场面时用 .gm visible 或临时调。
#  如果你的机器好，可以试 150。
#==============================================================================

Visibility.Distance.Continents = 100
Visibility.Distance.Instances = 170
Visibility.Distance.BG = 180
Visibility.Distance.Arenas = 180


#==============================================================================
#  查询缓存
#==============================================================================

# 缓存物品/生物查询数据
#   1 = 开启。你有 38608 个物品，开着能显著降低查询压力。
CacheDataQueries = 1


###############################################################################
#
#  线程数对照表（按你的 CPU 调整上面的值）
#
#  ┌──────────────┬──────────────────┬─────────────┬──────────────┐
#  │ CPU 物理核数 │ MapUpdate.Threads│ ThreadPool  │ DB.WorkerThr │
#  ├──────────────┼──────────────────┼─────────────┼──────────────┤
#  │ 2 核         │ 1                │ 2           │ 1            │
#  │ 4 核         │ 2                │ 4           │ 2            │
#  │ 6 核         │ 3                │ 4           │ 2            │
#  │ 8 核及以上   │ 4                │ 6           │ 2            │
#  └──────────────┴──────────────────┴─────────────┴──────────────┘
#
#  查看核数：任务管理器 -> 性能 -> CPU -> "内核"那一栏（不是"逻辑处理器"）
#
#  注意：MapUpdate.Threads 不是越大越好。
#        超过物理核数会导致线程争抢，反而变慢。
#
###############################################################################
