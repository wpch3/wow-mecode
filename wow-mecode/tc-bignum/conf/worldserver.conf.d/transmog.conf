[worldserver]

###################################################################################################
# 幻化系统 Transmogrification
#
# 把装备的外观换成别的物品，属性不变。
# 本服自定义实现，完全自由模式：不限甲类、不限职业、不限等级。
#
# 大部分项改完 .reload config 即可生效，不用重启。
###################################################################################################

# 总开关
#     0 = 关闭（所有幻化立即失效，恢复真实装备外观，数据不丢）
#     1 = 开启
# 默认 1
Transmog.Enable = 1

# 是否要求拥有该外观物品
#     0 = 自由模式，直接填物品ID就能变（GM 和魔改端推荐）
#     1 = 收集模式，外观物品必须在背包里
#
# 想做「外观收集」玩法时开 1。
# 默认 0
Transmog.RequireItem = 0

# 每个槽位幻化的费用（铜）
#     0      = 免费
#     10000  = 1 金
#     100000 = 10 金
# 默认 0
Transmog.CostPerSlot = 0

# 是否允许武器与护甲互相幻化
#     0 = 禁止（武器只能变武器，护甲只能变护甲）
#     1 = 允许（法杖可以变成板甲外观，会很怪）
#
# 说明：客户端对武器槽和护甲槽用不同的挂载点，
# 强行互换可能导致模型飞到脚下或不显示。
# 想玩梗可以开，正常玩建议保持 1（允许同类互换即可）。
# 默认 1
Transmog.AllowWeaponCross = 1

# 每个角色最多保存多少套外观方案
#     范围 1 - 50
# 默认 10
Transmog.MaxSets = 10

# 试穿预览持续多少秒后自动恢复
#     .transmog preview <物品ID> 用的
#     范围 3 - 120
# 默认 15
Transmog.PreviewSeconds = 15

###################################################################################################
# 说明：不可幻化的槽位
#
# 3.3.5 客户端对以下槽位不显示外观模型，本模块会直接拒绝：
#     颈部(1) 戒指1(10) 戒指2(11) 饰品1(12) 饰品2(13)
#
# 可幻化的 14 个槽位：
#     头部(0) 肩部(2) 衬衣(3) 胸甲(4) 腰带(5) 腿部(6) 靴子(7)
#     护腕(8) 手套(9) 披风(14) 主手(15) 副手(16) 远程(17) 战袍(18)
###################################################################################################
