########################################################################
#  step46  突破人数上限 —— 第1阶段配置
#
#  放到：  D:\TC-Build\bin\RelWithDebInfo\worldserver.conf.d\unlimited.conf
#
#  【注意事项】（都是踩过的坑）
#    1. 文件必须有 [worldserver] 段头，否则整个文件不加载
#    2. 注释必须【独立成行】，不能写在配置值后面
#    3. conf.d 目录不支持 Include 指令
#    4. 改完必须【重启 worldserver】
########################################################################

[worldserver]


########################################################################
#  一、游荡 bot 总数
#
#  botconfig.cpp:444  NpcBot.WanderingBots.Continents.Count
#
#  【硬约束】这个值必须 <= 数据库里的"可用备用数"
#      可用备用数 = creature_template_npcbot_extras 行数
#                 - characters_npcbot 行数
#
#  不够的话 botdatamgr.cpp:1878 会 ASSERT(false) 直接崩服：
#      "Only N out of M bots ... cannot be created. Aborting!"
#
#  用 step46 的 SQL 生成模板后，先跑第0步查"可用备用数"再填这里。
########################################################################

#  【重要】这个值必须【小于】数据库里的"可用备用数"，否则启动崩服。
#  报错长这样：
#      Only 312 out of 317 bots ... Desired amount (500) cannot be created. Aborting!
#      -> 312 就是可用备用数，你要的500超了 -> 崩
#
#  查可用备用数：跑 sql/诊断-为什么bot数量不够.sql 的第1步
#
#  【保守起见先填小的，能启动了再往上加】
NpcBot.WanderingBots.Continents.Count = 300


########################################################################
#  二、副本/团本人数上限
#
#  Map.cpp:3963  GetPlayersCountExceptGMs() >= maxPlayers 是全服唯一拦截点
#
#  【需要代码改动】这个配置项是 step46 新加的，
#  必须先按"安装说明"改完 World.h / World.cpp / Map.cpp 三处再重编译，
#  否则这一行会被忽略（日志里会提示 Missing name）。
#
#  1 = 完全忽略副本人数上限（5人本能进20个bot）
#  0 = 保持原版行为（默认）
########################################################################

Instance.IgnorePlayerLimit = 1


########################################################################
#  三、自己能带的 bot 数量
#
#  botconfig.cpp:468  必须【正好9个值】，对应9个等级段：
#      0-9, 10-19, 20-29, 30-39, 40-49, 50-59, 60-69, 70-79, 80-83
#  botconfig.cpp:470  个数不对会 ASSERT 直接崩服
#
#  【原版上限39】(MAX_RAID_SIZE-1)。装了 step46 的 botconfig.cpp 补丁后
#  上限提到 250（uint8 存储上限）。没装补丁就别写超过39的值。
#
#  【重要】超过40个之后，第41个及以后【不会显示在客户端团队框里】——
#  那是 3.3.5 客户端的硬限制，服务端改不了。bot 本身正常存在、正常战斗。
########################################################################

# 装了 step46 补丁后可以这样（最高250）
NpcBot.MaxBots = 5,10,20,30,50,80,120,180,250

# 【没装补丁】的话用这行（最高39），把上面那行注释掉
# NpcBot.MaxBots = 2,3,4,5,10,15,20,25,39


########################################################################
#  四、每个职业最多几个
#
#  botconfig.cpp:317  默认 1
#  想凑5个法师团就改大。0 = 不限（仍受上面总数约束）
########################################################################

NpcBot.MaxBotsPerClass = 50


########################################################################
#  五、每个账号总上限（跨角色）
#
#  botconfig.cpp:318  默认 0 = 不限
#  单人服建议保持 0
########################################################################

NpcBot.MaxBotsPerAccount = 0


########################################################################
#  六、启动后怎么确认生效
#
#  日志里应该看到：
#      >> Set up spawning of 500 wandering bots in XXX ms
#
#  【不能】出现这些：
#      NpcBot.MaxBots must have exactly 9 values      <- 值的个数不对，会崩
#      NpcBot.MaxBots value at offset N is X > 250    <- 超上限被强制压回
#      Only N out of M bots ... Aborting!             <- 模板不够，会崩
#      Missing name Instance.IgnorePlayerLimit        <- 代码补丁没装
#
#  游戏里验证：
#      .npcbot add 连续招募，能超过 39 个
#      带一堆bot进5人本，不再被"副本人数已满"拦住
########################################################################


########################################################################
#  七、性能提醒
#
#  TrinityCore 是【单线程主循环】，每个 bot 每 tick 都跑 AI。
#
#      500 个    基本无感
#    1,000 个    约 0.5-1 GB 内存，可接受
#   10,000 个    约 5-10 GB，单核吃紧
#  100,000 个    单进程扛不住（主循环会卡死，不是内存问题）
#
#  建议逐档验证：500 -> 1000 -> 3000，每档观察 worldserver 的
#  CPU 占用和 "Update time diff" 日志。
#
#  要真正上万，需要先做【bot 休眠/分片机制】（第3阶段）。
########################################################################
