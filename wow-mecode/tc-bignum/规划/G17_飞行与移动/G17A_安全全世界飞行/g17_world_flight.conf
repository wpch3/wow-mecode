###############################################################################
#
# G17-A：旧世界户外安全飞行
#
# 只扩展东部王国（map 0）和卡利姆多（map 1）的安全户外区域。
# 副本、团队副本、战场、竞技场、AREA_FLAG_NO_FLY_ZONE 始终禁止；
# 不改 DBC/MPQ/数据库，不绕过骑术，北裂境仍保留寒冷天气飞行 54197。
#
# 首次编译和默认启动必须保持 Enable=0。完成默认关闭验收后，再改为1并重启。
#
###############################################################################

[worldserver]

# 总开关：0=完全保持原版；1=允许下面规则许可的旧世界飞行。
WorldFlight.Enable = 0

# 旧世界扩展开关。保留独立键，便于以后扩展而无需改变总开关语义。
WorldFlight.AllowOldWorld = 1

# 1=阻止主城及其子区域；初版必须保持1，避免建筑碰撞缺失导致穿模/卡屋顶。
WorldFlight.BlockCapitalAreas = 1

# 1=阻止明确带 AREA_FLAG_INSIDE 的室内区域；建议保持1。
WorldFlight.BlockIndoorAreas = 1

# 额外禁飞 Area/Zone ID，英文逗号分隔、不要空格。例如：123,456,789
# 空值表示没有额外禁飞ID。NO_FLY/竞技场等硬边界无需写入此列表。
WorldFlight.BlockedAreaIds =
